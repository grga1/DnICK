{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'bootstrap.css' %}">
</head>
<body>

<div class="container-fluid">
    <img class="d-block mx-auto" src="{% static 'logo2.png' %}">
</div>

<div class="container-fluid">
    <div class="row justify-content-center">
{%for kniga in knigi%}
<div class="card m-5" style="width: 18rem;">
    <a href="{% url 'edit_kniga' kniga.id %}">
  <img src="{{kniga.slika.url}}" class="card-img-top" alt="...">
    </a>
  <div class="card-body">
    <h5 class="card-title">{{kniga.avtori.first}}</h5>
    <p class="card-text">{{kniga.naslov}}</p>
    <p class="card-text">{{kniga.cena}}$</p>
  </div>
</div>
{%endfor%}
</div>
</div>
</body>
</html>
