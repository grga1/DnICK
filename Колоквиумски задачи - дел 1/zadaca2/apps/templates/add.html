{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
        <link rel="stylesheet" href="{%static 'bootstrap.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Features</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Pricing</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<form method="POST" enctype="multipart/form-data" class="w-50 mx-auto p-5 bg-light rounded">
    {% csrf_token %}
    <h2 class="text-center text-danger mb-5">
        Add new destination
    </h2>
    <div class="mb-3">
        <label>Image</label>
        {{form.image}}
    </div>
    <div class="mb-3">
        <label>Destination</label>
        {{form.destination}}
    </div>
    <div class="mb-3">
        <label>Price</label>
        {{form.price}}
    </div>
    <div class="mb-3">
        <label>Lenght of trip</label>
        {{form.duration}}
    </div>
    <button type="submit" class="btn btn-danger w-100"> Add</button>
</form>
</body>
</html>
